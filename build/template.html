<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="Handleitung für den Einsatz generativer KI beim musikwissenschaftlichen Arbeiten.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="Handleitung für den Einsatz generativer KI beim musikwissenschaftlichen Arbeiten.">
<meta property="og:type" content="article">
<meta property="og:locale" content="de_DE">
<style>
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --text: #1f1d1a;
    --muted: #6b6457;
    --accent: #7a5c2e;
    --border: #e6e1d8;
    --link: #8a5a1a;
    --link-hover: #5e3d0f;
    --code-bg: #f1ede5;
    --shadow: 0 1px 3px rgba(40,30,10,.06), 0 8px 28px rgba(40,30,10,.05);
    --maxw: 46rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16140f;
      --surface: #1e1b15;
      --text: #ece7dc;
      --muted: #a79e8c;
      --accent: #d9b779;
      --border: #322d23;
      --link: #e0bd83;
      --link-hover: #f0d6a6;
      --code-bg: #262219;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    font-size: 1.125rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 1.4rem; }
  header.site {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 3.5rem 0 2.25rem;
  }
  header.site .kicker {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: .72rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 .9rem;
    font-weight: 600;
  }
  header.site h1 {
    font-size: clamp(1.9rem, 4.5vw, 2.85rem);
    line-height: 1.12;
    margin: 0;
    letter-spacing: -.01em;
    font-weight: 600;
  }
  header.site .stand {
    margin: 1.1rem 0 0;
    color: var(--muted);
    font-size: .95rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { padding: 2.75rem 0 1rem; }
  main h2 {
    font-size: 1.55rem;
    margin: 2.75rem 0 .8rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    font-weight: 600;
    letter-spacing: -.005em;
  }
  main h2:first-of-type { border-top: 0; padding-top: 0; margin-top: .5rem; }
  main h3 { font-size: 1.22rem; margin: 2rem 0 .6rem; font-weight: 600; }
  main h4 { font-size: 1.05rem; margin: 1.6rem 0 .5rem; font-weight: 600; color: var(--muted); }
  p { margin: 0 0 1.15rem; }
  a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--link-hover); }
  ol, ul { padding-left: 1.4rem; }
  li { margin: .35rem 0; }
  li::marker { color: var(--muted); }
  em { font-style: italic; }
  sup { font-size: .72em; }
  code {
    background: var(--code-bg);
    padding: .12em .4em;
    border-radius: 4px;
    font-size: .88em;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    word-break: break-word;
  }
  /* Fußnoten */
  .footnotes {
    margin-top: 3rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--border);
    font-size: .95rem;
    color: var(--muted);
  }
  .footnotes ol { padding-left: 1.2rem; }
  .footnotes li { margin: .5rem 0; }
  .footnote-backref { text-decoration: none; }
  a.footnote-ref { text-decoration: none; font-weight: 600; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
  footer.site {
    border-top: 1px solid var(--border);
    background: var(--surface);
    margin-top: 3rem;
    padding: 2.25rem 0 3rem;
    color: var(--muted);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: .92rem;
  }
  footer.site a { color: var(--link); }
  footer.site p { margin: .3rem 0; }
  ::selection { background: rgba(217,183,121,.35); }
</style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <p class="kicker">Handleitung · Musikwissenschaft</p>
      <h1>{{TITLE}}</h1>
      {{STAND}}
    </div>
  </header>
  <main>
    <div class="wrap">
      {{CONTENT}}
    </div>
  </main>
  <footer class="site">
    <div class="wrap">
      <p>Ergänzungen und Korrekturen sind willkommen – Änderungen werden per Pull Request auf GitHub vorgeschlagen, Diskussionen über Issues geführt.</p>
      <p><a href="https://github.com/digimuwi/handleitung-ki">Projekt auf GitHub</a> · <a href="https://github.com/digimuwi/handleitung-ki/blob/main/entwurf.md">Quelltext (entwurf.md)</a></p>
    </div>
  </footer>
</body>
</html>
